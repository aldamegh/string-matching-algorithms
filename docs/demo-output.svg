<g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21"><text x="44" y="169" fill="#5eead4" xml:space="preserve">$ java -cp build MatchDemo</text><text x="44" y="198" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="227" fill="#dbe5f4" xml:space="preserve">Text:    ABABABA</text><text x="44" y="256" fill="#dbe5f4" xml:space="preserve">Pattern: ABA</text><text x="44" y="285" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="314" fill="#dbe5f4" xml:space="preserve">Overlapping matches (zero-based UTF-16 positions)</text><text x="44" y="343" fill="#dbe5f4" xml:space="preserve">  Brute force: [0, 2, 4] (3 matches)</text><text x="44" y="372" fill="#dbe5f4" xml:space="preserve">  KMP: [0, 2, 4] (3 matches)</text><text x="44" y="401" fill="#dbe5f4" xml:space="preserve">  Boyer-Moore (bad character): [0, 2, 4] (3 matches)</text><text x="44" y="430" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="459" fill="#dbe5f4" xml:space="preserve">All three find positions 0, 2, and 4.</text></g>
